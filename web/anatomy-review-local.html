<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>鱼体模型 · 本地美术核验</title><style>body{margin:0;background:#dae0db;color:#263b36;font:16px system-ui}header{padding:18px;position:absolute;z-index:1}button,select{padding:10px;margin:5px}canvas{display:block}</style><header>鱼体模型 · 本地预览（不连接钱包、不生成 NFT）<br><select id="species"><option>草鱼</option><option>鲫鱼</option><option>细鳞鲑</option><option>鲈鱼</option><option>江团</option><option>中华鲟</option></select><button id="turn">切换提鱼姿态</button></header><script src="vendor/three.min.js"></script><script src="aquatic-rig.js"></script><script src="fish-motion.js?v=anatomy10"></script><script src="surface-craft.js"></script><script>
const T=THREE,scene=new T.Scene();scene.background=new T.Color('#dae0db');const cam=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);cam.position.set(.5,.35,3.4);cam.lookAt(-.1,0,0);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(r.domElement);scene.environment=SurfaceCraft(T,r).environment;scene.add(new T.HemisphereLight(0xe7f2ff,0x787964,2));const light=new T.DirectionalLight(0xfff5d6,2.5);light.position.set(-2,3,4);scene.add(light);const f=FishMotion(T);scene.add(f);document.querySelector('#species').onchange=e=>f.userData.species(e.target.value);document.querySelector('#turn').onclick=()=>{f.rotation.z=f.rotation.z?0:.9;f.rotation.y=f.rotation.y?0:-.7;};function frame(t){requestAnimationFrame(frame);f.userData.swim(t/1000,.35);r.render(scene,cam);}requestAnimationFrame(frame);
</script></html>
